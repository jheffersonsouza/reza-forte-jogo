<svg xmlns="http://www.w3.org/2000/svg" width="1152" height="648" viewBox="0 0 1152 648">
  <defs>
    <radialGradient id="candle" cx="576" cy="600" r="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffae4a" stop-opacity="0.45"/>
      <stop offset="0.45" stop-color="#d9702a" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="576" cy="360" r="760" gradientUnits="userSpaceOnUse">
      <stop offset="0.35" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.9"/>
    </radialGradient>
    <radialGradient id="moonlight" cx="200" cy="230" r="90" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9fb4d8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#9fb4d8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- taipa wall -->
  <rect width="1152" height="648" fill="#3b2517"/>
  <g fill="#4a2f1e">
    <ellipse cx="140" cy="420" rx="120" ry="60"/>
    <ellipse cx="900" cy="300" rx="160" ry="80"/>
    <ellipse cx="380" cy="160" rx="110" ry="50"/>
    <ellipse cx="1040" cy="480" rx="100" ry="50"/>
  </g>
  <!-- wattle showing where the clay fell off -->
  <g stroke="#23150c" stroke-width="5" fill="#2c1a0f">
    <path d="M820 380 q60 -30 120 10 q-20 50 -80 60 q-50 -20 -40 -70z"/>
    <path d="M260 300 q40 -20 80 0 q-10 40 -50 40 q-40 -10 -30 -40z"/>
  </g>
  <g stroke="#5a3a22" stroke-width="3">
    <path d="M830 395 h110 M835 415 h95 M850 435 h70 M860 380 v70 M890 378 v75 M920 385 v55"/>
    <path d="M268 310 h64 M275 325 h50 M285 300 v35 M305 298 v40"/>
  </g>
  <!-- ceiling beams -->
  <rect width="1152" height="46" fill="#1c110a"/>
  <g fill="#2a190e">
    <rect x="60" y="0" width="34" height="70"/>
    <rect x="330" y="0" width="34" height="70"/>
    <rect x="780" y="0" width="34" height="70"/>
    <rect x="1050" y="0" width="34" height="70"/>
  </g>
  <!-- small barred window with the full moon -->
  <rect x="150" y="180" width="100" height="100" fill="#0d1526"/>
  <circle cx="215" cy="215" r="22" fill="#e8e6d0"/>
  <g stroke="#2a190e" stroke-width="7">
    <path d="M183 180 v100 M217 180 v100"/>
  </g>
  <rect x="150" y="180" width="100" height="100" fill="none" stroke="#24160c" stroke-width="12"/>
  <rect x="80" y="160" width="240" height="160" fill="url(#moonlight)"/>
  <!-- closed wooden door -->
  <rect x="470" y="130" width="212" height="440" fill="#1e120a"/>
  <rect x="486" y="146" width="180" height="424" fill="#4a2f1b"/>
  <g stroke="#2c1b0f" stroke-width="4">
    <path d="M531 146 v424 M576 146 v424 M621 146 v424"/>
    <path d="M486 230 h180 M486 470 h180" stroke-width="14" stroke="#3a2414"/>
  </g>
  <rect x="640" y="340" width="16" height="36" rx="3" fill="#1a1a1a"/>
  <!-- floor -->
  <path d="M0 540 L1152 540 L1152 648 L0 648 Z" fill="#20130b"/>
  <path d="M0 540 L1152 540" stroke="#140c07" stroke-width="6"/>
  <rect width="1152" height="648" fill="url(#candle)"/>
  <rect width="1152" height="648" fill="url(#vignette)"/>
</svg>
