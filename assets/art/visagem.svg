<svg xmlns="http://www.w3.org/2000/svg" width="1152" height="648" viewBox="0 0 1152 648">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050a18"/>
      <stop offset="1" stop-color="#1a2640"/>
    </linearGradient>
    <radialGradient id="eye" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fffbe0"/>
      <stop offset="0.35" stop-color="#e6ff7a"/>
      <stop offset="1" stop-color="#b8ff3a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="576" cy="360" r="700" gradientUnits="userSpaceOnUse">
      <stop offset="0.3" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.95"/>
    </radialGradient>
  </defs>
  <rect width="1152" height="648" fill="#1d120b"/>
  <!-- open doorway to the caatinga -->
  <rect x="470" y="130" width="212" height="440" fill="#0f0905"/>
  <rect x="486" y="146" width="180" height="424" fill="url(#sky)"/>
  <circle cx="620" cy="200" r="30" fill="#e8e6d0"/>
  <path d="M486 520 Q560 500 666 515 V570 H486 Z" fill="#141a12"/>
  <!-- dry trees and a carnaubeira -->
  <g stroke="#0a0d0a" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M510 520 V440 M510 470 L494 450 M510 455 L528 430 M528 430 L536 420"/>
    <path d="M650 515 V400"/>
    <path d="M650 400 q-30 -4 -40 16 M650 400 q30 -4 40 16 M650 400 q-20 -20 -36 -16 M650 400 q20 -20 36 -16 M650 400 v-22"/>
  </g>
  <!-- the visagem: tall, thin, arms too long -->
  <g fill="#030303">
    <ellipse cx="576" cy="238" rx="24" ry="36"/>
    <path d="M560 268 Q576 262 592 268 L604 420 Q576 432 548 420 Z"/>
    <path d="M556 280 Q530 360 520 470 L528 472 Q544 380 566 300 Z"/>
    <path d="M596 280 Q622 360 632 470 L624 472 Q608 380 586 300 Z"/>
    <path d="M552 418 L546 560 L560 560 L570 424 Z"/>
    <path d="M600 418 L606 560 L592 560 L582 424 Z"/>
  </g>
  <circle cx="566" cy="234" r="12" fill="url(#eye)"/>
  <circle cx="588" cy="234" r="12" fill="url(#eye)"/>
  <!-- door swung inward -->
  <path d="M486 146 L420 170 L420 590 L486 570 Z" fill="#3a2414"/>
  <path d="M442 162 V584 M464 154 V578" stroke="#24160b" stroke-width="3"/>
  <path d="M0 540 H1152 V648 H0 Z" fill="#150d07"/>
  <rect width="1152" height="648" fill="url(#vignette)"/>
